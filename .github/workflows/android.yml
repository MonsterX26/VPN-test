name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Telecharger xray arm32
        run: |
          mkdir -p app/src/main/jniLibs/armeabi-v7a xray_bin
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm32-v7a.zip
          unzip -o xray.zip xray -d xray_bin
          cp xray_bin/xray app/src/main/jniLibs/armeabi-v7a/libxray.so

      - name: Compiler hev-socks5-tunnel
        run: |
          mkdir -p hev/jni
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel hev/jni/hev-socks5-tunnel
          printf 'include $(call all-subdir-makefiles)\n' > hev/jni/Android.mk
          printf 'APP_ABI := armeabi-v7a\nAPP_PLATFORM := android-21\n' > hev/jni/Application.mk
          cd hev
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
          cp libs/armeabi-v7a/libhev-socks5-tunnel.so ../app/src/main/jniLibs/armeabi-v7a/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Construire l'APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GraceTunnel-apk
          path: app/build/outputs/apk/release/*.apk
